name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running check moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    # macos-15 covers the oldest supported toolchain; macos-26 tracks the
    # newest Swift. Intel is left to the release workflow, which builds the
    # Intel bottle anyway: a third macOS job here only queued behind the
    # account's macOS concurrency limit.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Swift 6.1 toolchain
        if: startsWith(matrix.os, 'macos-15')
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      # The dependencies are over half of every build and change only with the
      # lockfile. A checkout's new timestamps still rebuild this package.
      - uses: actions/cache@v5
        with:
          path: .build
          key: swiftpm-${{ matrix.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ matrix.os }}-
      - name: swift build
        run: swift build --product kwwk
      - name: bundled resource self-test
        run: .build/debug/kwwk --self-test
      - name: swift test
        run: swift test

  build-linux:
    # 6.1 = the Package.swift tools-version floor; latest mirrors what
    # from-source users on current toolchains hit.
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "latest"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .build
          key: swiftpm-linux-${{ matrix.swift }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-linux-${{ matrix.swift }}-
      - name: install python3 (fake MCP servers in tests)
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: swift build
        run: swift build --product kwwk
      - name: bundled resource self-test
        run: .build/debug/kwwk --self-test
      - name: swift test
        run: swift test

  build-ios:
    # The `kwwk` CLI cross-compiled for iOS at the Package.swift floor, on the
    # newest toolchain. The Swift 6.1 floor itself is covered by macos-15 and
    # Linux 6.1 above.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: .build-ios
          key: swiftpm-ios-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-ios-
      - name: swift build (iOS 15, kwwk CLI)
        # There is no Swift SDK bundle for iOS, so each stage gets the
        # iPhoneOS sysroot by hand: frontend, C, link driver and ld. The native
        # build system keeps the -Xcc target out of the host tools libpng
        # builds, which swiftbuild would compile for iOS and link for macOS.
        run: |
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --build-system native --product kwwk \
            --scratch-path .build-ios \
            --triple arm64-apple-ios15.0 \
            -Xswiftc -sdk -Xswiftc "$sdk" \
            -Xcc -isysroot -Xcc "$sdk" \
            -Xswiftc -Xclang-linker -Xswiftc -isysroot \
            -Xswiftc -Xclang-linker -Xswiftc "$sdk" \
            -Xlinker -syslibroot -Xlinker "$sdk"
          bin="$(find .build-ios -path '*/debug/kwwk' -type f | head -n1)"
          vtool -show-build "$bin"
          vtool -show-build "$bin" | grep -qE '^ *platform (IOS|2)$'
          vtool -show-build "$bin" | grep -qE '^ *minos 15\.0$'

  build-catalyst:
    # The libraries for Mac Catalyst, in its own job so it builds beside the
    # iOS CLI rather than after it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: xcodebuild (Mac Catalyst 15, libraries)
        run: |
          xcodebuild build -scheme KWWKMCP \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath .build-catalyst CODE_SIGNING_ALLOWED=NO
